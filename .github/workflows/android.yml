
name: Clone Rush Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: mkdir -p www && cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons and Splash
        run: npx capacitor-assets generate --android

      - name: Sync Android
        run: npx cap sync android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/clone-rush-upload.jks"

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          marker = "    buildTypes {"

          if marker not in content:
              raise SystemExit("buildTypes block not found")

          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASSWORD")
              }
          }

          '''

          content = content.replace(marker, signing + marker, 1)

          start = content.index(marker)
          release = content.find("        release {", start)

          if release == -1:
              raise SystemExit("release build type not found")

          insert_at = release + len("        release {")
          content = (
              content[:insert_at]
              + "\n            signingConfig signingConfigs.release"
              + content[insert_at:]
          )

          path.write_text(content)
          print("Release signing configured successfully.")
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clone-rush-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Clone-Rush-Signed-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
