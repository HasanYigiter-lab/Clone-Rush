
name: Generate Clone Rush Upload Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate upload keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore clone-rush-upload.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=LAB STUDIO, OU=Games, O=LAB STUDIO, L=Elazig, ST=Elazig, C=TR"

      - name: Export upload certificate
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -export -rfc \
            -keystore clone-rush-upload.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file upload_certificate.pem

      - name: Create Base64 file
        run: |
          base64 -w 0 clone-rush-upload.jks > keystore-base64.txt

      - name: Upload private key files
        uses: actions/upload-artifact@v4
        with:
          name: Clone-Rush-Signing-Key
          path: |
            clone-rush-upload.jks
            upload_certificate.pem
            keystore-base64.txt
          retention-days: 1
