name: Gem Rush Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web files and bundle AdMob bridge
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx esbuild admob-bridge.js --bundle --format=iife --outfile=www/admob-bridge.js
          test -s www/index.html
          test -s www/admob-bridge.js

      - name: Add Android platform
        run: npx cap add android

      - name: Set Play Store Version Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+',
              r'\g<1>2',
              content,
              count=1
          )

          if count == 0:
              raise SystemExit("versionCode bulunamadı.")

          path.write_text(content)
          print("Google Play versionCode = 2")
          PY

      - name: Configure Android SDK Versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/variables.gradle")

          if not path.exists():
              raise SystemExit("android/variables.gradle bulunamadı.")

          content = path.read_text()

          versions = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36,
          }

          for key, value in versions.items():
              pattern = rf"(?m)^(\s*{key}\s*=\s*)\d+"
              content, count = re.subn(pattern, rf"\g<1>{value}", content)

              if count == 0:
                  raise SystemExit(f"{key} değişkeni bulunamadı.")

          path.write_text(content)

          print("Minimum SDK: 24")
          print("Compile SDK: 36")
          print("Target SDK: 36")
          PY

      - name: Generate App Icons and Splash
        run: npx capacitor-assets generate --android

      - name: Configure AdMob App ID
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/admob.xml <<'EOF'
          <resources>
              <string name="admob_app_id">ca-app-pub-3173758070343843~8176795807</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          if "com.google.android.gms.ads.APPLICATION_ID" not in content:
              entry = '''
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
          '''

              if "</application>" not in content:
                  raise SystemExit("application etiketi bulunamadı.")

              content = content.replace(
                  "</application>",
                  entry + "\n    </application>",
                  1
              )

          path.write_text(content)
          print("AdMob App ID configured.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Decode and verify signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 eksik" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "KEYSTORE_PASSWORD eksik" && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS eksik" && exit 1)

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gem-rush-upload.jks"

          test -s "$RUNNER_TEMP/gem-rush-upload.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/gem-rush-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          marker = "    buildTypes {"

          if marker not in content:
              raise SystemExit("buildTypes bloğu bulunamadı.")

          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          '''

          if "signingConfigs {" not in content:
              content = content.replace(marker, signing + marker, 1)

          start = content.index(marker)
          release = content.find("        release {", start)

          if release == -1:
              raise SystemExit("release build type bulunamadı.")

          insert_at = release + len("        release {")

          if "signingConfig signingConfigs.release" not in content[insert_at:insert_at + 250]:
              content = (
                  content[:insert_at]
                  + "\n            signingConfig signingConfigs.release"
                  + content[insert_at:]
              )

          path.write_text(content)
          print("Release signing configured.")
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/gem-rush-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD eksik" && exit 1)

          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Gem-Rush-Signed-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
