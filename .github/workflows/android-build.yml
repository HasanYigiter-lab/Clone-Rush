name: Gem Rush Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web files and bundle AdMob bridge
        run: |
          npm run build
          mkdir -p www
          cp index.html www/index.html
          npx --yes esbuild admob-bridge.js --bundle --platform=browser --format=iife --target=es2020 --outfile=www/admob-bridge.js

      - name: Verify Web Files and Release AdMob Configuration
        run: |
          echo "=== WWW FILES ==="
          find www -maxdepth 4 -type f
          test -s www/index.html
          test -s www/admob-bridge.js
          # Check release mode in the original source. esbuild may inline/remove the constant.
          grep -Fq "const TEST_MODE = false" admob-bridge.js
          # Confirm all production ad unit IDs are present in source and bundled output.
          grep -Fq "ca-app-pub-3173758070343843/8727460148" admob-bridge.js
          grep -Fq "ca-app-pub-3173758070343843/6264627536" admob-bridge.js
          grep -Fq "ca-app-pub-3173758070343843/7985224111" admob-bridge.js
          grep -Fq "ca-app-pub-3173758070343843/8727460148" www/admob-bridge.js
          grep -Fq "ca-app-pub-3173758070343843/6264627536" www/admob-bridge.js
          grep -Fq "ca-app-pub-3173758070343843/7985224111" www/admob-bridge.js
          ! grep -q 'id="adDiag"' www/index.html
          echo "Web files, live ad units and hidden diagnostic panel verified."

      - name: Add Android platform
        run: npx cap add android

      - name: Generate App Icons and Splash
        run: npx capacitor-assets generate --android

      - name: Configure AdMob App ID
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/admob.xml <<'XML'
          <resources>
              <string name="admob_app_id">ca-app-pub-3173758070343843~8176795807</string>
          </resources>
          XML

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          marker = "com.google.android.gms.ads.APPLICATION_ID"
          entry = '''<meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="@string/admob_app_id" />'''
          pattern = r'<meta-data\b(?=[^>]*android:name="' + re.escape(marker) + r'")[^>]*/>'

          if re.search(pattern, content):
              content = re.sub(pattern, entry, content, count=1)
          else:
              if "</application>" not in content:
                  raise SystemExit("AndroidManifest.xml application tag not found")
              content = content.replace(
                  "</application>",
                  "        " + entry + "\n    </application>",
                  1
              )

          path.write_text(content)
          print("AdMob App ID configured and verified.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Maven Central mirror
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/build.gradle")
          content = path.read_text()
          mirror = '''maven {
                      url "https://maven-central.storage-download.googleapis.com/maven2/"
                  }
                  '''

          if "maven-central.storage-download.googleapis.com" not in content:
              if "mavenCentral()" not in content:
                  raise SystemExit("mavenCentral() not found in android/build.gradle")
              content = content.replace("mavenCentral()", mirror + "mavenCentral()", 1)

          path.write_text(content)
          print("Maven Central mirror configured.")
          PY

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gem-rush-upload.jks"
          test -s "$RUNNER_TEMP/gem-rush-upload.jks"

      - name: Configure Android release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          if not path.exists():
              raise SystemExit("android/app/build.gradle not found")

          content = path.read_text()
          marker = "    buildTypes {"
          if marker not in content:
              raise SystemExit("buildTypes block not found")

          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_FILE"))
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          '''

          if "signingConfigs {" not in content:
              content = content.replace(marker, signing + marker, 1)

          start = content.index(marker)
          release = content.find("        release {", start)
          if release == -1:
              raise SystemExit("release build type not found")

          insert_at = release + len("        release {")
          if "signingConfig signingConfigs.release" not in content[insert_at:insert_at + 250]:
              content = content[:insert_at] + "\n            signingConfig signingConfigs.release" + content[insert_at:]

          path.write_text(content)
          print("Release signing configured.")
          PY

      - name: Build signed APK and AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/gem-rush-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secret. Configure KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Gem-Rush-Signed-Release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
